<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теплее! — админка</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f7; --surface: #ffffff; --border: #e3e3e8;
    --text: #17171a; --text-dim: #6b6b73;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --surface: #1b1b1f; --border: #2d2d33; --text: #f0f0f2; --text-dim: #a6a6ae; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; background: var(--bg); color: var(--text);
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px; text-align: center; max-width: 380px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: var(--text-dim); font-size: 14px; margin: 0 0 8px; line-height: 1.6; }
  code {
    background: var(--bg); padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🌡️ Теплее! — админка</h1>
    <p>Нет активной сессии или ссылка истекла.</p>
    <p>Напиши боту <code>/admin</code> в Telegram — он пришлёт свежую ссылку для входа (действует 5 минут).</p>
  </div>
</body>
</html>
